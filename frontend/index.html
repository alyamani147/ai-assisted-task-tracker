<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Tracker</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Final Project</p>
      <h1>AI-Assisted Task Tracker</h1>
      <p class="subtitle">Release-hardened Kanban board with due dates, overdue filtering, and tags.</p>
    </div>
    <button id="new-task-button" class="primary">+ New task</button>
  </header>

  <main>
    <section class="filters" aria-label="Task filters">
      <input id="search" type="search" placeholder="Search title or description" />
      <select id="priority-filter">
        <option value="">All priorities</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <input id="tag-filter" placeholder="Filter by tag" />
      <label class="checkbox"><input id="overdue-filter" type="checkbox" /> Overdue only</label>
      <button id="clear-filters" class="secondary">Clear</button>
    </section>

    <p id="message" role="status"></p>

    <section class="board" id="board">
      <div class="column"><h2>To do</h2><div class="task-list" data-status="todo"></div></div>
      <div class="column"><h2>In progress</h2><div class="task-list" data-status="in-progress"></div></div>
      <div class="column"><h2>Done</h2><div class="task-list" data-status="done"></div></div>
    </section>
  </main>

  <dialog id="task-dialog">
    <form id="task-form" method="dialog">
      <div class="dialog-header">
        <h2 id="dialog-title">Create task</h2>
        <button type="button" id="close-dialog" class="icon-button" aria-label="Close">×</button>
      </div>
      <input id="task-id" type="hidden" />
      <label>Title<input id="title" required maxlength="120" /></label>
      <label>Description<textarea id="description" maxlength="2000"></textarea></label>
      <div class="form-grid">
        <label>Status<select id="status"><option value="todo">To do</option><option value="in-progress">In progress</option><option value="done">Done</option></select></label>
        <label>Priority<select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
      </div>
      <label>Due date<input id="due-date" type="date" /></label>
      <label>Tags<input id="tags" placeholder="backend, urgent (max 5)" /></label>
      <p class="hint">Comma-separated, up to 5 tags. Empty tags are rejected.</p>
      <div class="dialog-actions">
        <button type="button" id="delete-task" class="danger hidden">Delete</button>
        <span></span>
        <button type="button" id="cancel-dialog" class="secondary">Cancel</button>
        <button type="submit" class="primary">Save task</button>
      </div>
    </form>
  </dialog>

  <script src="/static/app.js" defer></script>
</body>
</html>
