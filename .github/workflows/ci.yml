name: CI

on:
  push:
    branches: [main, mid-course-project, final-project]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

      - name: Verify required final-project files
        run: |
          test -f AGENTS.md
          test -f Dockerfile
          test -f .dockerignore
          test -f docs/release-evidence.md
          test -f docs/final-ai-review.md
          test -f docs/ai-playbook.md
          test -d frontend

  docker-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-assisted-task-tracker:${{ github.sha }} .

      - name: Start container
        run: docker run --detach --name task-tracker-ci -p 8000:8000 ai-assisted-task-tracker:${{ github.sha }}

      - name: Verify container health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status_code="$(curl --silent --output health.json --write-out '%{http_code}' http://127.0.0.1:8000/api/health || true)"
            if [[ "$status_code" == "200" ]]; then
              break
            fi
            sleep 1
          done

          echo "HTTP status: ${status_code}"
          echo "Response body: $(cat health.json 2>/dev/null || true)"
          test "$status_code" = "200"
          grep -q '"status":"ok"' health.json

          {
            echo "## Docker runtime verification"
            echo
            echo "- Image built successfully: \`ai-assisted-task-tracker:${{ github.sha }}\`"
            echo "- Container started successfully: \`task-tracker-ci\`"
            echo "- \`GET /api/health\` HTTP status: \`${status_code}\`"
            echo "- Response body: \`$(cat health.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs on failure
        if: failure()
        run: docker logs task-tracker-ci || true

      - name: Stop container
        if: always()
        run: docker rm --force task-tracker-ci || true
