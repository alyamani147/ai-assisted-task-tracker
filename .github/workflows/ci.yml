name: CI

on:
  push:
    branches: [main, mid-course-project, final-project]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

      - name: Verify required final-project files
        run: |
          test -f AGENTS.md
          test -f Dockerfile
          test -f .dockerignore
          test -f docs/release-evidence.md
          test -f docs/final-ai-review.md
          test -f docs/ai-playbook.md
          test -d frontend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-assisted-task-tracker:${{ github.sha }} .
